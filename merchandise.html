<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MerchandiseDoneDifferent</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
      background-color: #000;
      color: #f4f4f4;
    }

    .navigation {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.075);
      z-index: 2;
      padding: 15px 0;
    }

    .navigation ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .navigation ul li a {
      text-decoration: none;
      color: #f4f4f4;
      font-size: 1.2rem;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 15px;
      border-radius: 5px;
      transition: background 0.3s, color 0.3s;
    }

    .navigation ul li a:hover {
      background: #004ad4;
      color: #fff;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 100px 0;
    }

    .logo {
      max-height: 450px;
      opacity: 0.5;
      filter: drop-shadow(0 0 20px #004ad4);
      transition: transform 0.3s ease-in-out;
    }

    .logo:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 0 30px #42a5f5);
    }

    .top-links {
      display: flex;
      justify-content: space-between;
      padding: 40px;
      margin-top: 50px;
    }

    .link-item {
      text-align: center;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #004ad4;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      padding: 15px;
      transition: transform 0.3s, box-shadow 0.3s;
      color: #f4f4f4;
      flex: 1;
      margin: 0 10px;
    }

    .link-item:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.7);
    }

    .link-image {
      max-width: 100%;
      border-radius: 8px;
    }

    .about-us {
      text-align: center;
      padding: 50px 20px 80px; /* Extra padding to prevent overlap */
      margin: 20px auto;
      max-width: 800px;
      background: rgba(0, 0, 0, 0.8);
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
      line-height: 1.8;
    }

    .about-us h2 {
      font-size: 2rem;
      color: #004ad4;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .about-us p {
      font-size: 1.1rem;
      margin-bottom: 15px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      color: #f4f4f4;
      width: 100%;
    }

    .social-links {
      margin-top: 10px;
    }

    .social-links a img {
      height: 30px;
      margin: 0 10px;
      vertical-align: middle;
      filter: drop-shadow(0 0 4px #004ad4);
      transition: transform 0.3s;
    }

    .social-links a img:hover {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .logo-container {
        margin: 50px 0;
      }

      .logo {
        max-height: 300px;
      }

      .top-links {
        flex-direction: column;
        padding: 20px;
        gap: 20px;
      }

      .link-item {
        flex: none;
        width: 80%;
        margin: 10px auto;
      }

      .about-us {
        padding: 30px 10px 100px;
        max-width: 90%;
      }

      .navigation ul {
        flex-direction: column;
        gap: 10px;
      }

      .navigation ul li a {
        font-size: 1rem;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navigation">
    <ul>
      <li><a href="mainstream.html">Mainstream</a></li>
      <li><a href="monumental.html">Monumental</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Logo -->
<div class="logo-container">
  <a href="index.html"> <!-- Link to homepage (adjust if your homepage file name is different) -->
    <img src="assets/images/logo.png" class="logo" alt="Site Logo">
  </a>
</div>

  <!-- Top Links -->
  <section class="top-links">
    <div class="link-item">
      <a href="https://www.lamordusaunt.com/" target="_blank">
        <img src="assets/images/lamor.png" alt="LaMordusAunt" class="link-image">
      </a>
    </div>
    <div class="link-item">
      <a href="mainstream.html">
        <img src="assets/images/mainstream-digital.png" alt="Mainstream Digital" class="link-image">
      </a>
    </div>
    <div class="link-item">
      <a href="merchandise.html">
        <img src="assets/images/Merch.png" alt="Shop3" class="link-image">
      </a>
    </div>
  </section>

  <!-- About Us -->
  <section class="about-us">
    <h2>Info</h2>
    <p>Looking To Become A Partner? Please Feel Free To Reach Out Via Email.</p>
    <p>📩 Let’s connect and build something Monumental together!</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; Merchandise Done Different. All rights reserved.</p>
    <div class="social-links">
      <p>Follow Us</p>
      <a href="https://discord.gg/25s2TW4n95" target="_blank" title="Discord">
        <img src="assets/images/discord.png" alt="Discord">
      </a>
      <a href="https://www.youtube.com/@MDDProductions-tv" target="_blank" title="YouTube">
        <img src="assets/images/youtube.png" alt="YouTube">
      </a>
      <a href="https://www.tiktok.com/@mddproductions.tv" target="_blank" title="TikTok">
        <img src="assets/images/tiktok.png" alt="TikTok">
      </a>
    </div>
  </footer>

</body>
</html>
