<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MainStream Digital Dynamics</title>
  <link rel="icon" href="assets/images/favicon.png" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #000;
      color: #f4f4f4;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    .logo-container img {
      max-width: 200px;
      height: auto;
    }

    .category-navigation {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px;
    }

    .category-navigation button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #004ad4;
      color: #fff;
      border: none;
      border-radius: 6px;
      transition: background-color 0.3s ease;
      flex-grow: 1;
      min-width: 150px;
    }

    .category-navigation button:hover {
      background-color: #42a5f5;
    }

    .video-gallery {
      display: none;
      justify-content: center;
      padding: 0 20px 30px;
      width: 100%;
    }

    video {
      width: 1000%;
      max-width: 5000px;
      height: 900px;
      border-radius: 10px;
    }

    .active {
      display: flex;
    }

    footer {
      background: rgba(0, 0, 0, 0.85);
      color: #f4f4f4;
      text-align: center;
      padding: 20px 10px;
      margin-top: auto;
    }

    .social-links {
      margin-top: 10px;
    }

    .social-links a img {
      height: 30px;
      margin: 0 10px;
      vertical-align: middle;
      filter: drop-shadow(0 0 4px #004ad4);
      transition: transform 0.3s ease;
    }

    .social-links a img:hover {
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .category-navigation {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .category-navigation button {
        width: 100%;
        font-size: 18px;
      }

      .logo-container img {
        max-width: 150px;
      }

      .social-links a img {
        height: 24px;
        margin: 0 6px;
      }

      video {
        width: 100%;
        max-width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <a href="index.html">
        <img src="assets/images/logo.png" alt="MainStream Digital Dynamics Logo" />
      </a>
    </div>
  </header>

  <main>
    <section class="media-section">
      <div class="category-navigation">
        <button onclick="showCategory('youtubeVideos')">YouTube Videos</button>
        <button onclick="showCategory('youtubeShorts')">YouTube Shorts</button>
        <button onclick="showCategory('tiktokVideos')">TikTok</button>
      </div>

      <div id="videoPlayerContainer" class="video-gallery">
        <video id="videoPlayer" autoplay loop controls preload="auto">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; MainStream Digital Dynamics. All rights reserved.</p>
    <div class="social-links">
      <p>Follow Us</p>
      <a href="https://discord.gg/25s2TW4n95" target="_blank" title="Discord">
        <img src="assets/images/discord.png" alt="Discord" />
      </a>
      <a href="https://www.youtube.com/@MDDProductions-tv" target="_blank" title="YouTube">
        <img src="assets/images/youtube.png" alt="YouTube" />
      </a>
      <a href="https://www.tiktok.com/@mddproductions.tv" target="_blank" title="TikTok">
        <img src="assets/images/tiktok.png" alt="TikTok" />
      </a>
    </div>
  </footer>

  <script>
    const videoCategories = {
      youtubeVideos: "assets/videos/youtube/",
      youtubeShorts: "assets/videos/shorts/",
      tiktokVideos: "assets/videos/tiktok/"
    };

    const videoFiles = {
      youtubeVideos: ["video1.mp4", "video2.mp4", "video3.mp4"],
      youtubeShorts: ["short1.mp4", "short2.mp4"],
      tiktokVideos: ["tiktok1.mp4", "tiktok2.mp4"]
    };

    function showCategory(category) {
      const videoPlayerContainer = document.getElementById("videoPlayerContainer");
      const videoPlayer = document.getElementById("videoPlayer");

      videoPlayerContainer.classList.add("active");

      if (videoFiles[category].length > 0) {
        const randomVideo = videoFiles[category][Math.floor(Math.random() * videoFiles[category].length)];
        const videoPath = videoCategories[category] + randomVideo;
        videoPlayer.src = videoPath;
        videoPlayer.play();
      } else {
        alert("No videos available in this category.");
        videoPlayer.src = "";
      }
    }

    window.onload = () => {
      showCategory('youtubeVideos');
    };
  </script>
<!-- Footer with Social Media -->
<footer>
  <p>&copy; MDD Productions Contact. All rights reserved.</p>
  <div class="social-links">
    <p>Follow Us</p>
    <a href="https://discord.gg/jzztBxZ3p7" target="_blank" title="Discord">
      <img src="assets/images/discord.png" alt="Discord">
    </a>
    <a href="https://www.youtube.com/@MDDProductions-tv" target="_blank" title="YouTube">
      <img src="assets/images/youtube.png" alt="YouTube">
    </a>
    <a href="https://www.tiktok.com/@mddproductions.tv" target="_blank" title="TikTok">
      <img src="assets/images/tiktok.png" alt="TikTok">
    </a>
  </div>
</footer>

</body>
</html>
