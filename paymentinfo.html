<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Information</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #f4f4f4;
      padding-top: 120px;
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #000;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    .nav-logo img {
      height: 50px;
    }

    .nav-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .nav-toggle span {
      background: #f4f4f4;
      height: 3px;
      width: 25px;
      margin: 4px 0;
    }

    ul.nav-links {
      display: flex;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.nav-links li {
      margin: 0 15px;
    }

    ul.nav-links li a {
      color: #f4f4f4;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background 0.3s;
    }

    ul.nav-links li a:hover {
      background-color: #004ad4;
    }

    @media (max-width: 768px) {
      .nav-toggle {
        display: flex;
      }

      ul.nav-links {
        flex-direction: column;
        background: #000;
        position: absolute;
        top: 70px;
        left: 0;
        width: 100%;
        display: none;
      }

      ul.nav-links.show {
        display: flex;
      }

      ul.nav-links li {
        margin: 10px 0;
        text-align: center;
      }
    }

    .logo {
      text-align: center;
      margin-top: 20px;
      animation: moveLogo 5s infinite alternate;
    }

    .logo a {
      display: inline-block;
    }

    .logo img {
      max-height: 150px;
      filter: drop-shadow(0 0 8px #004ad4);
      animation: scaleLogo 2s infinite alternate;
    }

    @keyframes moveLogo {
      0% { transform: translateX(0); }
      100% { transform: translateX(30px); }
    }

    @keyframes scaleLogo {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #42a5f5;
    }

    form {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #004ad4;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #333;
      color: #fff;
    }

    button {
      background-color: #004ad4;
      color: white;
      padding: 12px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1a6cff;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #f4f4f4;
    }

    .social-links img {
      width: 30px;
      margin: 0 10px;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-container">
      <div class="nav-logo">
        <a href="index.html">
          <img src="assets/images/logo.png" alt="MDD Logo" />
        </a>
      </div>
      <div class="nav-toggle" onclick="toggleNav()">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="monumental.html">Real Estate</a></li>
      <li><a href="mainstream.html">Content Creation</a></li>
      <li><a href="merchandise.html">Merchandise</a></li>
      <li><a href="careers.html">Careers</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="forms.html">Forms</a></li>
    </ul>
  </nav>

  <!-- Logo -->
  <div class="logo">
    <a href="index.html">
      <img src="assets/images/logo.png" alt="MDD Logo" />
    </a>
  </div>

  <!-- Main Content -->
  <main>
    <h1>Payment Options Inquiry</h1>
    <p>Please fill out the form below to get more information about our payment options. You will be contacted shortly.</p>

    <form action="submit_payment_info.php" method="POST">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="payment">Preferred Payment Method:</label>
      <select id="payment" name="payment" required>
        <option value="">-- Select a Method --</option>
        <option value="paypal">PayPal</option>
        <option value="cashapp">Cash App</option>
        <option value="venmo">Venmo</option>
        <option value="zelle">Zelle</option>
      </select>

      <label for="message">Additional Message (Optional):</label>
      <textarea id="message" name="message" rows="4"></textarea>

      <button type="submit">Submit Request</button>
    </form>
  </main>

  <!-- Footer with Social Media -->
  <footer>
    <p>&copy; MDD Productions Contact. All rights reserved.</p>
    <div class="social-links">
      <p>Follow Us</p>
      <a href="https://discord.gg/25s2TW4n95" target="_blank" title="Discord">
        <img src="assets/images/discord.png" alt="Discord">
      </a>
      <a href="https://www.youtube.com/@MDDProductions-tv" target="_blank" title="YouTube">
        <img src="assets/images/youtube.png" alt="YouTube">
      </a>
      <a href="https://www.tiktok.com/@mddproductions.tv" target="_blank" title="TikTok">
        <img src="assets/images/tiktok.png" alt="TikTok">
      </a>
    </div>
  </footer>

  <script>
    function toggleNav() {
      const nav = document.getElementById('navLinks');
      nav.classList.toggle('show');
    }
  </script>
</body>
</html>
